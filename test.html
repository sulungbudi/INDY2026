const char INDEX_HTML[] = R"rawliteral(
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Face Tracking - ESP32 Camera</title>
    <style>
        body { font-family: Arial; text-align: center; background: #111; color: white; }
        .container { position: relative; width: 640px; margin: auto; }
        #streamImg, #canvas { position: absolute; top: 0; left: 0; }
        .info { background: #222; padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Face Tracking dari ESP32-S3 Camera</h1>
    <div class="container">
        <!-- stream endpoint is relative to the page -->
        <img id="streamImg" src="/stream" width="640" height="480" crossorigin="anonymous">
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>
    <div class="info">
        Jumlah wajah: <span id="faceCount">0</span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        }
    }
    </script>

    <script type="module">
        import { FaceDetector, FilesetResolver } from "@mediapipe/tasks-vision";

        const streamImg = document.getElementById('streamImg');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const faceCountSpan = document.getElementById('faceCount');

        let faceDetector = null;
        let running = false;

        // Initialize MediaPipe Face Detector
        async function initFaceDetector() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
            );
            faceDetector = await FaceDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
                },
                runningMode: "VIDEO",
                minDetectionConfidence: 0.5
            });
            running = true;
            processFrame();
        }

        // Process each new frame
        function processFrame() {
            if (!running) return;

            // Draw the current image onto the canvas
            ctx.drawImage(streamImg, 0, 0, canvas.width, canvas.height);

            // Run face detection on the canvas
            if (faceDetector) {
                const detections = faceDetector.detectForVideo(canvas, performance.now());
                faceCountSpan.textContent = detections.detections.length;

                // Draw bounding boxes (optional)
                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 2;
                for (const detection of detections.detections) {
                    const box = detection.boundingBox;
                    ctx.strokeRect(box.originX, box.originY, box.width, box.height);
                }
            }

            requestAnimationFrame(processFrame);
        }

        // Start when the image loads
        streamImg.onload = function() {
            if (!faceDetector) {
                initFaceDetector();
            }
        };

        // Handle errors – retry after a moment
        streamImg.onerror = function() {
            setTimeout(() => {
                streamImg.src = '/stream?' + Date.now();
            }, 500);
        };

        // Start the stream (workaround for initial load)
        streamImg.src = '/stream?' + Date.now();
    </script>
</body>
</html>
)rawliteral";
