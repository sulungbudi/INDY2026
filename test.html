<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Camera Stream</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        img { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>
    <img id="stream" src="http://192.168.31.179/stream" crossorigin="anonymous" onerror="this.src=this.src+'?'+Date.now();">
    <script>
        // Optional: auto-reload on error
        const img = document.getElementById('stream');
        img.onerror = function() {
            this.src = 'http://192.168.31.179/stream?' + Date.now();
        };
    </script>
</body>
</html>
